name: qfildroid
description: >-
  QFILdroid - a Qualcomm EDL (Emergency Download) firmware servicing
  workstation running on Android. USB OTG host connectivity, Sahara and
  Firehose protocol engines, firmware package management and validated
  flashing workflows.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  crypto: ^3.0.3
  xml: ^6.5.0
  path: ^1.9.0
  archive: ^3.6.1
  file_picker: ^8.0.6
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B0F0D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
